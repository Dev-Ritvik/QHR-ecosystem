name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck, Lint, and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Vitest (Domain)
        run: pnpm turbo run test

  e2e-pacemaker:
    name: Playwright E2E (Merge Blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter public exec playwright install --with-deps chromium

      - name: Run Presentation Flow E2E
        run: pnpm --filter public exec playwright test
        env:
          # Expects the staging projection DB URL from GitHub Secrets for the seeded test data
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING_PROJECTION }}
          PLAYWRIGHT_TEST_BASE_URL: http://present.localhost:3000
