name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck, Lint, and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Vitest (Domain)
        run: pnpm turbo run test

  e2e-pacemaker:
    name: Playwright E2E (Merge Blocking)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: estate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d estate_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/estate_ci
      DATABASE_URL_MIGRATIONS: postgresql://postgres@127.0.0.1:5432/estate_ci
      DATABASE_URL_SEED: postgresql://postgres@127.0.0.1:5432/estate_ci
      PLAYWRIGHT_TEST_BASE_URL: http://present.localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply DB migrations for E2E
        run: |
          for file in packages/db/migrations/*.sql; do
            pnpm dlx tsx packages/db/apply_migration.ts "$file"
          done

      - name: Install Playwright Browsers
        run: pnpm --filter public exec playwright install --with-deps chromium

      - name: Run Presentation Flow E2E
        run: pnpm --filter public exec playwright test
