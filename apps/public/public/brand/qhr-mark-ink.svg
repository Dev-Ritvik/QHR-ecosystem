<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 224" role="img" aria-label="Quality Homes Reality">
  <title>Quality Homes Reality</title>
  <!--
    Canonical mark, ink finish. Reconstructed as vector from the client's
    raster artwork: every form here is a circle, an arc or a straight edge, so
    the redraw is exact rather than a trace approximation.

    Layer order matters and is not arbitrary: the Q sits BEHIND the house, so
    the house's lower band crosses it and the orange shows through the doorway.
    That overlap is what fuses the two letters into one mark instead of two
    stacked shapes.
  -->
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B75BC"/>
      <stop offset="0.55" stop-color="#2E3192"/>
    </linearGradient>
  </defs>

  <!-- Q -->
  <g fill="#F15A24">
    <circle cx="100" cy="166" r="46"/>
    <path d="M126 190 L156 214 L124 214 Z"/>
  </g>

  <!-- House: outer silhouette with the doorway knocked out (evenodd) -->
  <path fill="url(#roof)" fill-rule="evenodd"
        d="M100 6 L194 76 L194 152 L6 152 L6 76 Z
           M100 54 L156 96 L156 152 L44 152 L44 96 Z"/>

  <!-- H, with the stem drawn out into the Q -->
  <g fill="#2E3192">
    <rect x="64" y="72" width="20" height="58" rx="7"/>
    <rect x="116" y="72" width="20" height="58" rx="7"/>
    <rect x="64" y="90" width="72" height="20" rx="7"/>
    <rect x="84" y="90" width="32" height="106" rx="15"/>
  </g>
</svg>
